<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BHB · Plan individual de dezvoltare</title>
<style>
/* ============================================================
   Plan individual de dezvoltare — generator de sine stătător
   NU depinde de core/shell.css sau core/shell.js (D-brief 2026-07-13:
   "folded into the platform as a module later, generator first" — acest
   fișier trebuie să funcționeze prin dublu-click, fără server, offline).
   Fonturi & sigle: referințe relative statice către core/assets/ — sunt
   fișiere, nu framework, deci nu încalcă regula "not shell-bound".
   Paleta & tokeni: copiați din core/shell.css pt. consistență vizuală D70.
   ============================================================ */
@font-face{font-family:'Zona Pro';src:url('assets/fonts/ZonaPro-Light.otf') format('opentype');font-weight:300;font-display:swap}
@font-face{font-family:'Zona Pro';src:url('assets/fonts/ZonaPro-Regular.otf') format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'Zona Pro';src:url('assets/fonts/ZonaPro-SemiBold.otf') format('opentype');font-weight:600;font-display:swap}
@font-face{font-family:'Zona Pro';src:url('assets/fonts/ZonaPro-Bold.otf') format('opentype');font-weight:700;font-display:swap}
@font-face{font-family:'Zona Pro';src:url('assets/fonts/ZonaPro-ExtraBold.otf') format('opentype');font-weight:800;font-display:swap}
@font-face{font-family:'Poppins';src:url('assets/fonts/Poppins-Light.ttf') format('truetype');font-weight:300;font-display:swap}
@font-face{font-family:'Poppins';src:url('assets/fonts/Poppins-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Poppins';src:url('assets/fonts/Poppins-Medium.ttf') format('truetype');font-weight:500;font-display:swap}
@font-face{font-family:'Poppins';src:url('assets/fonts/Poppins-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
:root{
  --aqua:#09bad2; --aqua-d:#0794a7; --aqua-dd:#067a8a;
  --green:#39b54a; --green-d:#2d9640;
  --yellow:#f8ec32; --yellow-d:#e3d716;
  --ink:#231f20; --ink-2:#3c4245;
  --red:#ef4136; --red-d:#cf2b21;
  --amber:#f4b71e; --forest:#377c58; --magenta:#9e1f63; --purple:#662d91; --indigo:#2b3990;
  --bg:#f3f7f8; --card:#ffffff;
  --muted:#6f7d82; --muted-2:#9aa7ab;
  --line:#e2eaec; --line-2:#cfdbde;
  --tint-aqua:#e7f7fa; --tint-green:#eaf7ec; --tint-yellow:#fdf9dc; --tint-red:#fdeae8; --tint-amber:#fdf3d9;
  --grad:linear-gradient(90deg,#09bad2 0%,#39b54a 55%,#f8ec32 100%);
  --grad-soft:linear-gradient(120deg,#e9f9fc 0%,#eefaf0 60%,#fdfbe8 100%);
  --shadow:0 1px 3px rgba(20,30,60,.07),0 7px 22px rgba(20,30,60,.06);
  --shadow-lg:0 4px 14px rgba(20,30,60,.10),0 18px 48px rgba(20,30,60,.12);
  --r:14px; --r-sm:10px;
  --font:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-head:'Zona Pro','Poppins',sans-serif;
  --font-doc:'Zona Pro','Poppins',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:13.8px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1{font-family:var(--font-head);font-size:21px;font-weight:800;letter-spacing:-.2px}
h2{font-family:var(--font-head);font-size:16.5px;font-weight:700}
h3{font-family:var(--font-head);font-size:14.6px;font-weight:600}
a{color:var(--aqua-dd);cursor:pointer;font-weight:500}
button{font-family:inherit}
:focus-visible{outline:2.5px solid var(--aqua);outline-offset:2px;border-radius:6px}
::placeholder{color:var(--muted-2)}

header{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.grad-line{height:5px;background:var(--grad)}
.head-in{max-width:1200px;margin:0 auto;padding:20px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:220px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:var(--ink);flex:none}
.logoimg{height:38px;width:auto;flex:none;display:block}
.rcover .rlogo{position:absolute;top:20px;right:22px;height:24px;width:auto;opacity:.95}
.brand h1{margin:0;font-size:18px}
.brand .sub{margin:1px 0 0;font-size:11.6px;color:#b9c6ca}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.langtog{display:flex;background:rgba(255,255,255,.1);border-radius:20px;padding:3px}
.langtog button{background:none;border:none;color:#c9d5d8;padding:5px 12px;border-radius:16px;font-size:11.6px;font-weight:700;cursor:pointer}
.langtog button.active{background:#fff;color:var(--ink)}

main{max-width:1200px;margin:0 auto;padding:24px 26px 70px}
.sub{color:var(--muted);font-size:12.6px;margin:2px 0 18px;max-width:900px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:15px}
.card.flat{box-shadow:none}
.pagehead{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.pagehead .ph-actions{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.crumbs{font-size:11.6px;color:var(--muted);margin-bottom:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumbs a:hover{text-decoration:underline}

.btn{border:none;border-radius:11px;padding:9px 17px;font-family:inherit;font-size:12.6px;font-weight:600;cursor:pointer;transition:.13s;display:inline-flex;align-items:center;gap:8px;line-height:1.35}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:var(--green-d)}
.btn-aqua{background:var(--aqua);color:#fff}.btn-aqua:hover{background:var(--aqua-d)}
.btn-yellow{background:var(--yellow);color:var(--ink)}.btn-yellow:hover{background:var(--yellow-d)}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:var(--red-d)}
.btn-ghost{background:#fff;border:1.5px solid var(--line-2);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--muted-2)}
.btn-sm{padding:6px 12px;font-size:11.4px;border-radius:9px}
.btn-big{padding:12px 22px;font-size:14px;border-radius:12px;font-weight:700}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.filebtn{position:relative;overflow:hidden;display:inline-flex}
.filebtn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}

.dropzone{border:2px dashed var(--line-2);border-radius:var(--r);padding:30px 20px;text-align:center;color:var(--muted);background:var(--grad-soft);cursor:pointer;transition:.15s}
.dropzone.drag{border-color:var(--aqua);background:#e6f8fb}
.dropzone b{color:var(--ink);display:block;margin-bottom:4px;font-size:13.4px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:10.8px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-bottom:1.5px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);font-size:12.8px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.rowactions{display:flex;gap:6px;justify-content:flex-end}

.pill{border-radius:20px;padding:3px 11px;font-size:10.4px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.p-notstarted{background:var(--tint-yellow);color:#8a6d00}
.p-inprogress{background:var(--tint-aqua);color:var(--aqua-dd)}
.p-done{background:var(--tint-green);color:#1e7a43}
.band-critic{background:var(--tint-red);color:var(--red-d)}
.band-progres{background:var(--tint-amber);color:#8a5a00}
.band-asteptat{background:var(--tint-aqua);color:var(--aqua-dd)}
.band-avansat{background:var(--tint-green);color:#1e7a43}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.chip{background:var(--tint-aqua);color:var(--aqua-dd);border-radius:20px;padding:4.5px 12px;font-size:11.6px;font-weight:500;display:inline-flex;align-items:center;gap:7px;border:1.5px solid transparent;cursor:pointer}
.chip.sel{border-color:var(--aqua);background:#d4f1f7;font-weight:700}
.chip.ghostch{background:#fff;border-color:var(--line);color:var(--muted)}
.chip.ghostch:hover{border-color:var(--aqua);color:var(--aqua-dd)}
.chip[disabled]{opacity:.4;cursor:not-allowed;pointer-events:none}

.compcard{border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;transition:.12s;background:#fff}
.compcard.sel{border-color:var(--aqua);background:#f0fbfd;box-shadow:0 0 0 3px var(--tint-aqua)}
.compcard.na{opacity:.55}
.compcard h4{font-family:var(--font-head);font-size:13.4px;font-weight:700;margin:0 0 6px}
.compcard .avg{font-size:11px;color:var(--muted)}

.behrow{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.behrow:last-child{border-bottom:none}
.behrow input[type=checkbox]{margin-top:4px;accent-color:var(--green);width:15px;height:15px;flex:none}
.behrow input[type=text]{flex:1;border:1px solid transparent;border-radius:7px;padding:3px 6px;font-size:12.6px;font-family:inherit;background:transparent}
.behrow input[type=text]:hover,.behrow input[type=text]:focus{border-color:var(--line-2);background:#fff}
.behrow .score{font-size:10.6px;font-weight:700;color:var(--muted);flex:none;min-width:16px;text-align:center}
.behrow .comp-tag{font-size:10.2px;color:var(--muted-2);flex:none}

.lb{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 5px}
.lb:first-child{margin-top:0}
input[type=text],input[type=date],input[type=number],input[type=email],textarea,select{
  width:100%;padding:8px 11px;border:1.5px solid var(--line-2);border-radius:9px;font-family:inherit;font-size:12.8px;color:var(--ink);background:#fff}
textarea{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.steps{display:flex;gap:9px;margin-bottom:18px;flex-wrap:wrap}
.steps>button{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:8px 12px;font-weight:600;box-shadow:var(--shadow);flex:1 1 140px;justify-content:flex-start;text-align:left;cursor:pointer;font-family:inherit;font-size:12px;transition:.13s}
.steps>button:hover{background:#f0fafc}
.steps>button.active{border-color:var(--aqua);background:#e6f8fb;outline:2px solid var(--aqua)}
.steps .stnum{width:24px;height:24px;border-radius:50%;background:#e7ebf0;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:11.6px;font-weight:800;flex:none}
.steps>button.active .stnum{background:var(--aqua);color:#fff}
.steps>button.done .stnum{background:var(--green);color:#fff}
.stepnav{display:flex;gap:9px;margin-top:4px;align-items:center;flex-wrap:wrap}
.stepnav .spacer{flex:1}

.methodblock{border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:12px}
.methodblock h4{font-family:var(--font-head);font-size:13px;margin-bottom:4px}
.rectext{font-size:12px;color:var(--muted);background:var(--tint-yellow);border-radius:8px;padding:7px 10px;margin:6px 0 10px}
.rectext .gtag{font-size:9.6px;text-transform:uppercase;letter-spacing:.05em;font-weight:800;color:#8a6d00;margin-right:6px}
.pickrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.pickrow:last-child{border-bottom:none}
.pickrow .mname{font-weight:600;min-width:150px;flex:1}
.pickrow input[type=date],.pickrow input[type=number]{width:auto;min-width:120px}
.pickrow input[type=number]{min-width:64px}
.ffdate{font-size:11.6px;color:var(--aqua-dd);font-weight:700;margin-top:8px}

.toastwrap{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:400;max-width:340px}
.toast{background:var(--ink);color:#fff;border-radius:13px;padding:11px 15px;font-size:12.2px;box-shadow:var(--shadow-lg);line-height:1.5;border-left:4px solid var(--aqua)}
.toast.ok{border-left-color:var(--green)}.toast.err{border-left-color:var(--red)}.toast.warn{border-left-color:var(--amber)}

.empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:12.6px}
.note{font-size:11.6px;color:var(--muted-2);margin-top:6px}
.warnbox{background:var(--tint-amber);color:#8a5a00;border-radius:9px;padding:9px 12px;font-size:12px;margin-bottom:14px}

/* ---------- document / print (Ilie Petran layout, D70; two pages per
   person as of rev.3 — see @media print below for the landscape switch) ---------- */
.docstage{background:#dfe4e9;border-radius:12px;padding:24px;overflow:auto}
.docstage .page{background:#fff;box-shadow:0 2px 14px rgba(20,30,60,.2);border-radius:3px;margin:0 auto 24px;padding:26px 30px;max-width:780px;width:100%;font-family:var(--font-doc)}
.docstage .page.landscape{max-width:1040px}
.docstage .page:last-child{margin-bottom:0}
.pdoc .rcover{border-radius:10px;background:#fff;color:var(--ink);border:1px solid var(--line);padding:18px 22px;position:relative;overflow:hidden;margin-bottom:16px}
.pdoc .rcover .rbar{height:5px;border-radius:4px;background:var(--grad);margin-bottom:14px}
.pdoc .rcover .reyebrow{font-size:9.6px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;opacity:.75}
.pdoc .rcover h2{font-size:23px;font-weight:800;letter-spacing:-.4px;margin:4px 0 3px}
.pdoc .rcover .rmeta{font-size:11.4px;color:var(--muted);opacity:1}
.pdoc h4.rsec{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--aqua-dd);font-weight:800;margin:16px 0 7px;display:flex;align-items:center;gap:8px}
.pdoc h4.rsec::after{content:"";flex:1;height:1.5px;background:var(--line)}
.pdoc ul.pbeh{list-style:none;margin:0 0 4px}
.pdoc ul.pbeh li{font-size:11px;padding:3px 0 3px 14px;position:relative;line-height:1.4}
.pdoc ul.pbeh li::before{content:"–";position:absolute;left:0;color:var(--aqua-dd)}
.pdoc ul.pbeh li .ctag{color:var(--muted-2);font-size:9.6px}
.pdoc .cmtbox{border:1.3px dashed var(--line-2);border-radius:9px;padding:9px 11px;min-height:44px;font-size:11px;color:var(--ink-2);margin-top:4px;white-space:pre-wrap}
.pdoc .pfoot{margin-top:16px;font-size:9.6px;color:var(--muted-2);display:flex;justify-content:space-between}
.objillu{text-align:right;margin:-4px 0 0}
.pdoc .rcover .objillu{float:right;margin:-2px 0 0 16px;max-width:110px}
.objillu img{width:110px;height:auto;opacity:.92;border-radius:8px}

/* ---------- calendar page: month-grid Gantt, one row per method pick
   (brief §3d/5, rev.3 — "no overlap when periods coincide") ---------- */
.calwrap{margin-top:2px}
.calrow{display:flex;align-items:center;min-height:22px}
.calrow.calheader{min-height:20px;margin-bottom:4px}
.calrowlabel{flex:none;width:150px;font-size:10.4px;font-weight:600;padding-right:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.caltrack{position:relative;flex:1;height:18px}
.calheader .caltrack{height:16px}
.calgrid{position:absolute;top:0;bottom:0;width:1px;background:rgba(35,31,32,.1)}
.calmonth{position:absolute;top:0;font-size:8.6px;color:var(--muted);font-weight:700;transform:translateX(2px)}
/* 2026-08-03 hotfix (label clipping): the bar used to BE the label box, so a
   short duration pill silently swallowed the method name and the dates. The
   pill is now just the duration; the text lives in .calbartxt, which stays
   inside while it fits and is moved outside the pill (right, or left when the
   bar sits near the end of the track) by fitCalendarLabels() when it doesn't.
   Outside, the method name is dropped — .calrowlabel already carries it — so
   only the date range (+ owner) spills out, in ink instead of white. */
.calbar{position:absolute;top:2px;height:14px;border-radius:4px;background:var(--aqua);color:#fff;font-size:8.4px;font-weight:700;overflow:visible;white-space:nowrap}
.calbartxt{position:absolute;left:0;top:0;height:100%;width:100%;display:flex;align-items:center;padding:0 6px;overflow:hidden;white-space:nowrap;box-sizing:border-box}
.calbar.lbl-right .calbartxt{left:100%;width:auto;color:var(--ink-2);padding:0 0 0 5px;overflow:visible}
.calbar.lbl-left .calbartxt{left:auto;right:100%;width:auto;color:var(--ink-2);padding:0 5px 0 0;overflow:visible}
.calgroup{margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.calgroup:last-child{border-bottom:none}
.calgroupname{font-size:11.4px;font-weight:700;font-family:var(--font-head);margin:6px 0 3px}
.calrow.calff .calrowlabel{color:var(--red-d);font-weight:700}
.calstar{position:absolute;top:-2px;color:var(--red-d);transform:translateX(-6.5px)}
.calstarlabel{position:absolute;top:14px;font-size:8px;color:var(--red-d);font-weight:800;white-space:nowrap;transform:translateX(-50%)}

/* ---------- score graph (bands + marker, board + print) — 2026-07-13 rev ---------- */
.sgwrap{max-height:340px;overflow-y:auto;padding-right:2px}
.sgrow{margin-bottom:11px}
.sgrow:last-child{margin-bottom:0}
.sgname{font-size:11.8px;font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sgname .sgband-lbl{font-size:9.6px;color:var(--muted);font-weight:700}
.sgtrack{position:relative;height:9px;border-radius:5px;overflow:hidden;background:#eee}
.sgtrack.tall{height:11px}
.sgband{position:absolute;top:0;bottom:0}
.sgband.band-critic{background:var(--tint-red)}
.sgband.band-progres{background:var(--tint-amber)}
.sgband.band-asteptat{background:var(--tint-aqua)}
.sgband.band-avansat{background:var(--tint-green)}
.sggrid{position:absolute;top:0;bottom:0;width:1px;background:rgba(35,31,32,.12)}
.sgmark{position:absolute;top:1px;bottom:1px;width:6%;min-width:5px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 1.5px #fff}
.sgval{font-size:10.4px;color:var(--muted);text-align:right;margin-top:2px}
.pdoc .sgname{font-size:10.6px}
.pdoc .sgname>span:first-child{color:var(--aqua-dd);border-left:3px solid var(--aqua);padding-left:6px}
.pdoc .sgval{font-size:9.4px}
.pdoc .method-summary{font-size:10.4px;line-height:1.35}
.pdoc .method-summary-group{margin:0 0 6px;break-inside:avoid}
.pdoc .method-summary-group:last-child{margin-bottom:0}
.pdoc .method-summary-group .pbeh{margin-bottom:0}

/* ---------- priority-behavior curation (anti-overwhelm, 2026-07-13 rev) ---------- */
.behgroup{border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:11px}
.behgroup-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.behgroup-head b{font-family:var(--font-head);font-size:13px}
.curatedbadge{font-size:11.4px;font-weight:700;color:var(--aqua-dd);background:var(--tint-aqua);border-radius:20px;padding:4px 12px;display:inline-flex;gap:5px}
.curatedbadge.over{color:#8a5a00;background:var(--tint-amber)}

/* ---------- setup page: objectives editor (2026-07-13 rev.3) ---------- */
.objrow{padding:8px 0;border-bottom:1px dashed var(--line)}
.objrow:last-child{border-bottom:none}
.objtext{font-size:12px;font-weight:600;margin-bottom:5px}
.objfields{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.objfields label{font-size:9.6px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.objfields label.muted{opacity:.55}
.objfields input{margin-top:3px;font-size:11.6px}

/* ---------- method catalog cards (2026-07-13 rev) ---------- */
.methodcard{border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;cursor:pointer;transition:.12s;background:#fff}
.methodcard:hover{border-color:var(--line-2)}
.methodcard.sel{border-color:var(--aqua);background:#f0fbfd;box-shadow:0 0 0 3px var(--tint-aqua)}
.methodcard .mrank{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--aqua-dd);font-weight:800;margin-bottom:4px}
.methodcard h5{font-family:var(--font-head);font-size:12.6px;font-weight:700;margin:0 0 4px}
.methodcard .mdesc{font-size:11px;color:var(--ink-2);line-height:1.45;margin-bottom:5px}
.methodcard .msuit{font-size:10.2px;color:var(--muted);line-height:1.4}
.methodcard .msuit b{color:var(--ink-2)}
.methodcard input[type=text]{margin-top:7px}

/* Portrait content plus one calendar sheet per person, with the portrait
   content allowed to flow across as many sheets as it needs. The calendar
   uses the CSS Paged Media geometry below — supported in Chromium's print/
   PDF engine (which this project already assumes for "print-to-PDF from
   browser"; other engines may ignore the named @page and print everything
   portrait — flag to PO if the team ever prints from Firefox/Safari).
   2026-07-24 print-fidelity fix: (a) print-color-adjust:exact so the dark
   covers, score bands, Gantt bars and gridlines survive even when the user
   hasn't ticked "Background graphics" in the Save-as-PDF dialog (that box is
   OFF by default and was silently dropping every colour); (b) the print copy
   now FLOWS in normal position — siblings hidden with display:none, not
   visibility:hidden over an absolutely-positioned #printArea. The old
   absolute overlay suppressed the named @page landscape (Chromium ignores
   `page:` on an out-of-flow box), so the Calendar came out portrait and the
   Gantt was truncated; in normal flow the landscape page renders landscape.

   2026-08-03 hotfix (PDF orientation): the named `@page landscape` produced a
   PDF with MIXED page sizes — Chromium's Save-as-PDF writes one A4 portrait
   sheet and one A4 landscape sheet, which most downstream tools (and the
   client's own document system) cannot store or reprint as one document. The
   deliverable is now a single-page-size PDF: EVERY sheet is A4 portrait and
   the Calendar's CONTENT is rotated 90° inside its portrait sheet (.rot),
   so the file stays portrait while the Gantt still gets the long edge. The
   rotation is a user toggle (STATE.pdfCalRotate) — turning it off prints the
   Calendar upright on the portrait sheet for anyone who wants it that way.

   The #printArea page boxes now carry EXPLICIT A4 content-box dimensions on
   screen as well as in print (186mm portrait / 272mm rotated long edge, i.e.
   A4 minus the 12mm margins). That is not cosmetic: fitCalendarLabels()
   measures the Gantt on screen just before window.print(), so the measured
   layout has to be the printed layout, not the browser window's width. */
@page{size:A4 portrait;margin:12mm}
#printArea .page{box-sizing:border-box;margin:0 auto;background:#fff;font-family:var(--font-doc)}
#printArea .page.portrait{width:186mm}
#printArea .page.landscape{width:186mm}
#printArea .page.landscape .rotwrap{width:100%}
/* .rotwrap is taken OUT OF FLOW on purpose. A transform does not shrink an
   element's layout box, so an in-flow 272mm-wide wrapper inside a 185mm page
   overflows the paper — and Chromium's print engine reacts to that by
   shrink-to-fitting the WHOLE document to ~68%, which silently miniaturised
   both pages (found in test, 2026-08-03). Absolute + overflow:hidden keeps
   the layout box off the page's flow so nothing triggers the auto-scale. */
#printArea .page.landscape.rot{position:relative;width:185mm;height:272mm;padding:0;overflow:hidden}
#printArea .page.landscape.rot .rotwrap{position:absolute;top:0;left:0;width:272mm;height:185mm;box-sizing:border-box;transform-origin:top left;transform:translateX(185mm) rotate(90deg)}
@media print{
  html,body{margin:0;padding:0;background:#fff}
  body>*{display:none !important}
  #printArea{display:block !important;position:static;width:100%;margin:0;padding:0}
  #printArea,#printArea *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  #printArea .page{box-shadow:none;page-break-after:always;break-after:page}
  #printArea .page:last-child{page-break-after:auto;break-after:auto}
}

<script>
/* =======================================================================
   STATE
   ======================================================================= */
var LANG = 'ro';
/* pdfCalRotate (2026-08-03): print the Calendar page as rotated content on an
   A4 PORTRAIT sheet (default, keeps the whole PDF one page size) vs. upright
   portrait. Session-level, not per-person — one PDF convention per project. */
var STATE = { people: [], activeId: null, view: 'setup', projectBank: null, bankReviewed: false, pendingImportNames: [],
 groupProject: '', migration: { legacyProjectAudit: [], conflict: false },
 pdfCalRotate: true, assessment: { objectives:{}, methods:null } };
var UID = 1;
function nid(p){ return (p||'id') + (UID++); }

/* ---------- unsaved-work protection (2026-07-14 polish increment, DoD 1):
   explicit JSON save/load stays the master copy; on top of it we add
   (a) a dirty marker (dot on the Save button), (b) a close-tab warning
   while dirty, (c) a silent localStorage auto-backup as CRASH RECOVERY
   (localStorage works fine in a double-clicked file in Chrome — the old
   "standalone HTML can't persist" claim was wrong), offered back with a
   restore banner when the app reopens onto an empty session. ---------- */
var LAST_SAVED = '';
function snapshot(){ try{ return JSON.stringify({v:3,g:STATE.groupProject||'',m:STATE.migration||{},p:STATE.people,a:STATE.assessment}); }catch(e){ return ''; } }
function isDirty(){ return (STATE.people.length>0 || String(STATE.groupProject||'')) && snapshot()!==LAST_SAVED; }
var BACKUP_KEY = 'bhb-devplan-autobackup';
var _lastBackup = '';
var RESTORE_OFFER = null;
function autoBackup(){
 if(!STATE.people.length && !String(STATE.groupProject||'')) return;
 var s = snapshot(); if(s===_lastBackup) return;
 try{
  localStorage.setItem(BACKUP_KEY, JSON.stringify({v:3,t:new Date().toISOString(), lang:LANG, groupProject:STATE.groupProject||'', migration:STATE.migration||{}, people:STATE.people, assessment:STATE.assessment, pdfCalRotate:STATE.pdfCalRotate!==false}));
  _lastBackup = s;
 }catch(e){}
}
function doRestoreBackup(){
 var ob = RESTORE_OFFER; RESTORE_OFFER = null;
 if(!ob) return;
 applySessionPayload(ob, true);
 if(ob.lang) LANG = ob.lang;
 STATE.people.forEach(recomputeAverages); // 2026-08-03 backfill, see loadSessionFile
 rebuildProjectBank(); STATE.bankReviewed = true; STATE.view = 'roster';
 LAST_SAVED = ''; // restored ≠ saved to file yet
 render();
 toast('<b>'+t('sessionLoaded')+'</b>','ok');
}
function restoreBanner(){
 if(!RESTORE_OFFER || STATE.people.length || String(STATE.groupProject||'')) return '';
 var when = String(RESTORE_OFFER.t||'').slice(0,16).replace('T',' ');
 return '<div class="warnbox" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+
  '<span style="flex:1">'+t('restoreFound')+(when?' ('+when+')':'')+'</span>'+
  '<button class="btn btn-green btn-sm" onclick="doRestoreBackup()">'+t('restore')+'</button>'+
  '<button class="btn btn-ghost btn-sm" onclick="RESTORE_OFFER=null;render()">'+t('discard')+'</button></div>';
}

/* v3 group Project contract (D259). Legacy participant values are read only
   during migration; the live model has one canonical group value. */
function migrateLegacyProject(people, obj){
 var audit = obj && obj.migration && Array.isArray(obj.migration.legacyProjectAudit) ? obj.migration.legacyProjectAudit.slice() : [];
 var values = [];
 (people||[]).forEach(function(p,idx){
  var raw = p && p.meta ? String(p.meta.project||'') : '';
  var trimmed = raw.trim();
  if(trimmed) values.push({person:personLabel(p)||('Person '+(idx+1)),value:trimmed});
 });
 var distinct = [];
 values.forEach(function(v){ if(!distinct.some(function(x){return x.value===v.value;})) distinct.push(v); });
 var canonical = obj && obj.v>=3 && obj.groupProject!=null ? String(obj.groupProject).trim() : '';
 var conflict = false;
 if(obj && obj.v>=3){
  conflict = !!(obj.migration && obj.migration.conflict);
 } else if(distinct.length===1){
  canonical = distinct[0].value;
 } else if(distinct.length>1){
  canonical = '';
  conflict = true;
  audit = values.map(function(v){return {person:v.person,value:v.value};});
 }
 if(!conflict && !audit.length && obj && obj.migration && obj.migration.conflict) conflict=true;
 (people||[]).forEach(function(p){ if(p && p.meta && Object.prototype.hasOwnProperty.call(p.meta,'project')) delete p.meta.project; });
 return {groupProject:canonical, migration:{legacyProjectAudit:audit,conflict:conflict}};
}
function applySessionPayload(obj, restoring){
 obj=obj||{};
 var people=Array.isArray(obj.people)?obj.people:[];
 var mig=migrateLegacyProject(people,obj);
 STATE.people=people;
 STATE.groupProject=mig.groupProject||'';
 STATE.migration=mig.migration;
 STATE.assessment=obj.assessment||{objectives:{},methods:null};
 STATE.pdfCalRotate = (obj.pdfCalRotate===undefined) ? true : !!obj.pdfCalRotate;
 STATE.people.forEach(recomputeAverages);
 STATE.activeId=null; STATE.view='roster';
 rebuildProjectBank(); STATE.bankReviewed=true;
 if(!restoring) RESTORE_OFFER=null;
}

/* ---------- two-step inline confirm (DoD 5: replaces native confirm();
   first click arms the button — "Sigur?" — second click within 3s executes). ---------- */
var ARMED = {};
function armDo(key,fn){
 if(ARMED[key]){ delete ARMED[key]; fn(); return; }
 ARMED[key] = true; render();
 setTimeout(function(){ if(ARMED[key]){ delete ARMED[key]; render(); } },3000);
}

/* =======================================================================
   Bands (competency score, 1–5 normalized scale from import) — RESOLVED
   2026-07-13 rev.3 (brief §3c: "the four bands as 4 equal intervals of the
   scale"), superseding the earlier provisional 2/2.75/3.5 cutoffs borrowed
   from the platform's CP benchmark. 1–5 split into 4 equal 1-point bands.
   ======================================================================= */
var BANDS = [
 {key:'critic', max:2, ro:'CRITIC', en:'CRITICAL'},
 {key:'progres', max:3, ro:'ÎN PROGRES', en:'IN PROGRESS'},
 {key:'asteptat', max:4, ro:'AȘTEPTAT', en:'EXPECTED'},
 {key:'avansat', max:Infinity, ro:'AVANSAT', en:'ADVANCED'}
];
function bandOf(avg){ if(avg==null||isNaN(avg)) return null; for(var i=0;i<BANDS.length;i++){ if(avg<BANDS[i].max) return BANDS[i]; } return BANDS[BANDS.length-1]; }

/* ---------- score graph: band-colored track + marker (DoD 3, output-research
   recommendation of "horizontal bars with score bands" over radar for print).
   Domain fixed at 1–5 (the import's normalized scale); band segment widths
   are derived from BANDS so they stay in sync if the cutoffs change. Reused
   by the board (all bank competencies) and print (selected only). Purely
   per-competency math — works unmodified whether there's 1 competency or
   many (DoD 10). ---------- */
function pctOf(v){ if(v==null||isNaN(v)) return 0; return Math.max(0,Math.min(100,(v-1)/4*100)); }
function bandSegments(){
 var prev=1, out=[];
 BANDS.forEach(function(b){
  var hi=Math.min(b.max,5);
  if(hi>prev){ out.push({key:b.key, left:pctOf(prev), width:pctOf(hi)-pctOf(prev)}); prev=hi; }
 });
 return out;
}
function gridlineOffsets(){
 // faint gridline every 0.25 across the 1–5 domain (brief §3c), excluding
 // the domain edges (0%/100%, already the track's own border).
 var out=[];
 for(var v=1.25; v<5; v+=0.25){ out.push(Math.round(pctOf(v)*100)/100); }
 return out;
}
function bandTrackHtml(avg,tall){
 var segHtml = bandSegments().map(function(s){ return '<div class="sgband band-'+s.key+'" style="left:'+s.left+'%;width:'+s.width+'%"></div>'; }).join('');
 var gridHtml = gridlineOffsets().map(function(pos){ return '<div class="sggrid" style="left:'+pos+'%"></div>'; }).join('');
 // rectangular block marker (brief §3c: "not a thin line/dot"), centered on
 // the value, clamped so it doesn't overflow the track at the domain edges.
 var markHtml='';
 if(avg!=null && !isNaN(avg)){
  var pos = pctOf(avg);
  var left = Math.max(0,Math.min(100-6,pos-3));
  markHtml = '<div class="sgmark" style="left:'+left+'%"></div>';
 }
 return '<div class="sgtrack'+(tall?' tall':'')+'">'+segHtml+gridHtml+markHtml+'</div>';
}
function scoreGraphSection(bank,onlyNames,tall){
 var list = onlyNames ? bank.filter(function(c){ return onlyNames.indexOf(c.name)>=0; }) : bank;
 if(!list.length) return '';
 return list.map(function(c){
  var band=bandOf(c.average);
  return '<div class="sgrow"><div class="sgname"><span>'+esc(c.name)+'</span>'+(band?'<span class="sgband-lbl">'+band[LANG]+'</span>':'')+'</div>'+
   bandTrackHtml(c.average,tall)+
   '<div class="sgval">'+(c.assessed?fmt1(c.average)+' / 5':t('notAssessed'))+'</div></div>';
 }).join('');
}

/* Suggestion ranking (brief §Methods catalog: "rank methods whose
   target-competency tags match the selected competency — name match
   against the imported bank; unmatched banks → show full catalog
   unranked"). Loose text-overlap match: strip diacritics/punctuation,
   compare significant words (len>=4). Real strategic-bank competency
   names rarely literally match the LSI tag categories (brief's own "Key
   finding": template bank ≠ import bank) — an empty "matched" list,
   falling through to the full catalog unranked, is the expected common
   case, not a bug. */
function normWords(s){
 return String(s||'').toLowerCase()
  .normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(function(w){return w.length>=4;});
}
function tagOverlap(tag,compName){
 var a=normWords(tag), b=normWords(compName);
 return a.some(function(w){return b.indexOf(w)>=0;});
}
function rankedMethods(compName){
 var list = getMethods().filter(function(m){return !m.free;});
 var matched = list.filter(function(m){ return (m.tags||[]).some(function(tag){return tagOverlap(tag,compName);}); });
 var rest = list.filter(function(m){ return matched.indexOf(m)<0; });
 return {matched:matched, rest:rest};
}

function fmt1(n){ return (n==null||isNaN(n)) ? '—' : (Math.round(n*10)/10).toString().replace('.',','); }
function todayISO(){
 // local calendar date, NOT toISOString() (which converts to UTC and rolls
 // back a day in the early-morning hours in Romania's UTC+2/+3 timezone).
 var d=new Date();
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayStr(){ var d=new Date(); return String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear(); }
function addDays(iso,n){
 // pure UTC calendar math — avoids local-timezone rollback (Romania is UTC+2/+3,
 // so a local Date + toISOString() round-trip silently loses a day; caught by
 // test-flow.mjs during DoD verification, 2026-07-13).
 if(!iso) return null;
 var p=iso.split('-').map(Number);
 var d=new Date(Date.UTC(p[0],p[1]-1,p[2]));
 d.setUTCDate(d.getUTCDate()+n);
 return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
}

/* =======================================================================
   PARSER — .xls-as-HTML participant export (brief §Import format).
   Structure (decoded, do NOT re-derive): 3 top-level tables in <body> —
   [0] header (session code h3, date, firstname/lastname/code/position/
   Email/phone label→value rows), [1] a label-only legend table, [last]
   the data table: one outer row per competency (td0=name, td1=nested
   subcompetency table, td2=normalized 1–5 average); each subcompetency
   row repeats the pattern one level down (td0=name, td1=nested behavior
   table [text|raw 0–2 score w/ junk-byte prefix|comment], td2=average,
   which repeats the parent competency average). Empty nested table +
   empty average = not assessed. HTMLTableElement.rows is natively scoped
   to direct rows only, so no manual recursion-guard is needed per table.
   ======================================================================= */
function parseImportXls(text){
 var doc;
 try{ doc = new DOMParser().parseFromString(text,'text/html'); }catch(e){ return {ok:false,why:'parse-error'}; }
 var tables = Array.prototype.slice.call(doc.body.querySelectorAll(':scope > table'));
 if(!tables.length) return {ok:false,why:'no-tables'};
 var headerTable = tables[0];
 var dataTable = tables[tables.length-1];
 var meta = {firstname:'',lastname:'',code:'',position:'',email:'',phone:'',sessionCode:'',exportDate:''};
 Array.prototype.forEach.call(headerTable.rows,function(r){
  var c0=r.cells[0]; if(!c0) return;
  var h3=c0.querySelector('h3.box-title'); if(h3){ meta.sessionCode=h3.textContent.trim(); return; }
  var raw=(c0.textContent||'').trim();
  var dm=raw.match(/date:\s*([\d\-: ]+)/i); if(dm){ meta.exportDate=dm[1].trim(); return; }
  var label=raw.toLowerCase().replace(/:$/,'').trim();
  if(['firstname','lastname','code','position','email','phone'].indexOf(label)>=0){
   var v=''; for(var i=1;i<r.cells.length;i++){ var cv=(r.cells[i].textContent||'').trim(); if(cv){ v=cv; break; } }
   meta[label]=v;
  }
 });
 var bank=[];
 Array.prototype.forEach.call(dataTable.rows,function(row){
  if(!row.cells || row.cells.length<3) return;
  var name=(row.cells[0].textContent||'').trim();
  if(!name) return;
  var subTable = row.cells[1] ? row.cells[1].querySelector('table') : null;
  var avgRaw=(row.cells[2].textContent||'').trim();
  var average = avgRaw ? parseFloat(avgRaw.replace(',','.')) : null;
  if(average!=null && isNaN(average)) average=null;
  var subs=[];
  if(subTable){
   Array.prototype.forEach.call(subTable.rows,function(sr){
    if(!sr.cells || sr.cells.length<2) return;
    var sname=(sr.cells[0].textContent||'').trim();
    if(!sname) return;
    var behTable = sr.cells[1] ? sr.cells[1].querySelector('table') : null;
    var savgRaw = sr.cells[2] ? (sr.cells[2].textContent||'').trim() : '';
    var saverage = savgRaw ? parseFloat(savgRaw.replace(',','.')) : null;
    if(saverage!=null && isNaN(saverage)) saverage=null;
    var behaviors=[];
    if(behTable){
     Array.prototype.forEach.call(behTable.rows,function(br){
      var btext = br.cells[0] ? (br.cells[0].textContent||'').trim() : '';
      if(!btext) return;
      var rawScore = br.cells[1] ? (br.cells[1].textContent||'') : '';
      var digits = rawScore.replace(/[^0-9]/g,'');
      var score = digits==='' ? null : parseInt(digits,10);
      var comment = br.cells[2] ? (br.cells[2].textContent||'').trim() : '';
      behaviors.push({text:btext,score:score,comment:comment});
     });
    }
    subs.push({name:sname,average:saverage,behaviors:behaviors});
   });
  }
  bank.push({name:name,average:average,assessed:(subs.length>0 && average!=null),subs:subs});
 });
 return {ok:true,meta:meta,bank:bank};
}

/* ---------- CSV (Evaluation Sheet import/export) — no external libs, same
   quoted-field parser pattern as the platform's agenda-generator CSV. ---------- */
function csvParse(text){
 var rows=[],row=[],cur='',q=false;
 for(var i=0;i<text.length;i++){ var ch=text[i];
  if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
  else{ if(ch==='"') q=true;
   else if(ch===','){ row.push(cur); cur=''; }
   else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
   else if(ch==='\r'){}
   else cur+=ch; }
 }

var SETUP_SUMMARY = null; // transient: last sheet-import result shown inline on Setup
function importEvalSheetText(text){
 // Setup redesign 2026-07-16 (DoD 2): besides storing the objective texts,
 // BUILD the competency bank from the sheet's own competency/subcompetency/
 // behavior columns — previously ignored, so importing a CSV on a fresh
 // session produced only a toast and a page that looked unchanged.
 var rows = csvParse(String(text).replace(/^﻿/,'')).filter(function(row){ return row.some(function(v){return String(v).trim();}); });
 if(rows.length<2){ toast(t('evalImportFailed'),'err'); return false; }
 var hdr = rows[0].map(function(h){ return String(h).replace(/^﻿/,'').trim().toLowerCase(); });
 var iBeh=hdr.indexOf('behavior'), iComp=hdr.indexOf('competency'), iSub=hdr.indexOf('subcompetency'),
  i0=hdr.indexOf('objective_text_score_0'), im1=hdr.indexOf('objective_text_score_-1'),
  i1=hdr.indexOf('objective_text_score_1'), i2=hdr.indexOf('objective_text_score_2');
 if(iBeh<0){ toast(t('evalImportFailed'),'err'); return false; }
 // Merge semantics: importing a second sheet ADDS to the sheet bank (union
 // by competency/sub/behavior, same as objectives merge by behavior key) —
 // it never wipes what an earlier sheet contributed.
 var n=0, nTexts=0, byComp={}, order=[];
 (STATE.assessment.sheetBank||[]).forEach(function(c){
  var ce=byComp[c.name]={name:c.name,subs:{},subOrder:[]}; order.push(c.name);
  (c.subs||[]).forEach(function(s){ ce.subs[s.name]={name:s.name,behaviors:(s.behaviors||[]).slice()}; ce.subOrder.push(s.name); });
 });
 var inFile={};
 for(var k=1;k<rows.length;k++){
  var row=rows[k]; var bt=String(row[iBeh]||'').trim(); if(!bt) continue;
  var o = {
   '0': i0>=0?String(row[i0]||'').trim():'',
   '-1': im1>=0?String(row[im1]||'').trim():'',
   '1': i1>=0?String(row[i1]||'').trim():'',
   '2': i2>=0?String(row[i2]||'').trim():''
  };
  STATE.assessment.objectives[bt] = o;
  nTexts += (o['0']?1:0)+(o['-1']?1:0)+(o['1']?1:0)+(o['2']?1:0);
  n++;
  var cn = iComp>=0?String(row[iComp]||'').trim():'';
  if(cn){
   inFile[cn]=1;
   var sn = iSub>=0?String(row[iSub]||'').trim():'';
   if(!sn) sn = cn; // empty subcompetency = repeat of the competency (collapsed in UI)
   var ce = byComp[cn]; if(!ce){ ce=byComp[cn]={name:cn,subs:{},subOrder:[]}; order.push(cn); }
   var se = ce.subs[sn]; if(!se){ se=ce.subs[sn]={name:sn,behaviors:[]}; ce.subOrder.push(sn); }
   if(se.behaviors.indexOf(bt)<0) se.behaviors.push(bt);
  }
 }
 if(order.length){
  STATE.assessment.sheetBank = order.map(function(cn){
   var c=byComp[cn];
   return {name:c.name, subs:c.subOrder.map(function(sn){ return {name:sn, behaviors:c.subs[sn].behaviors}; })};
  });
  rebuildProjectBank();
 }
 SETUP_SUMMARY = { comps:Object.keys(inFile).length, behs:n, texts:nTexts }; // counts from THIS file, not the merged total
 render();
 toast('<b>'+n+'</b> '+t('evalImportedOk'),'ok');
 return true;
}

/* One entry point for every import surface (dropzone, file input, page-wide

function routeImportFiles(fileList){
 if(typeof FileReader==='undefined'){ toast('Importul de fișiere nu e disponibil în acest mediu.','warn'); return; }
 var files = Array.prototype.slice.call(fileList||[]);
 if(!files.length) return;
 var xls=[], csv=[];
 files.forEach(function(f){ (/\.csv$/i.test(f.name) ? csv : xls).push(f); });
 csv.forEach(function(f){

/* =======================================================================
   Import handling
   ======================================================================= */
function handleImportFiles(fileList){
 if(typeof FileReader==='undefined'){ toast('Importul de fișiere nu e disponibil în acest mediu.','warn'); return; }
 var files = Array.prototype.slice.call(fileList||[]);
 if(!files.length) return;
 var remaining = files.length, ok=0, fail=0, names=[];
 files.forEach(function(f){
  var r=new FileReader();
  r.onload=function(){
   var res = parseImportXls(String(r.result));
   if(res.ok && res.bank.length){
    var p = blankPerson('import');
    p.meta = Object.assign(p.meta, res.meta);
    p.bank = res.bank;
    p.planDate = todayISO();
    STATE.people.push(p);
    names.push(personLabel(p));
    ok++;
   } else fail++;
   remaining--;
   if(remaining===0) finishImport(ok,fail,names);
  };
  r.onerror=function(){ remaining--; fail++; if(remaining===0) finishImport(ok,fail,names); };
  r.readAsText(f);
 });
}

/* =======================================================================
   Priority behaviors (auto-derive per brief: score<2 in a selected comp)
   ======================================================================= */
function computeAutoPriority(p){
 // Objectives (brief §Objectives, corrected with PO 2026-07-14): actual
 // behavior scores are ONLY the non-negative integers 0/1/2 — "-1" is not
 // a score at all, it's a second text field authored alongside the "1"
 // field, shown together with it when a behavior is evaluated at 1 (its
 // job elsewhere in the app too). So candidates are behaviors scoring
 // 0 or 1 (score<2 — the original Excel rule, restored). Displayed text:
 // score 0 → the score-0 objective text; score 1 → the score-1 text and
 // the paired "-1" text shown together. Falls back to the raw behavior
 // text piecemeal when a field hasn't been written yet, so candidates
 // never silently disappear. Not checked into the print plan by default
 // (PO 2026-07-14) — the consultant curates which candidates make it in.
 var out=[];
 p.sel.forEach(function(compName){
  var comp = p.bank.find(function(c){return c.name===compName});
  if(!comp) return;
  (comp.subs||[]).forEach(function(s){
   (s.behaviors||[]).forEach(function(b){
    if(b.score===0 || b.score===1){
     var obj = objectivesFor(b.text);
     var text;
     if(b.score===0){
      text = (obj && obj['0']) ? obj['0'] : b.text;
     } else {
      var t1 = obj && obj['1'] ? obj['1'] : '';
      var tm1 = obj && obj['-1'] ? obj['-1'] : '';
      text = (t1 && tm1) ? (t1+' '+tm1) : (t1 || tm1 || b.text);
     }
     out.push({id:nid('bh'),comp:compName,sub:s.name,text:text,rawText:b.text,score:b.score,included:false,manual:false});
    }
   });
  });
 });
 return out;
}
function ensurePriorityFresh(p){
 // recompute only the auto (non-manual) rows when selection changes; keep manual rows + user edits to auto rows' included/text
 var auto = computeAutoPriority(p);
 var prevAuto = (p.priority||[]).filter(function(r){return !r.manual});
 var prevManual = (p.priority||[]).filter(function(r){return r.manual});
 auto.forEach(function(a){
  var prev = prevAuto.find(function(x){return x.comp===a.comp && x.sub===a.sub && x.rawText===a.rawText});
  if(prev){ a.included=prev.included; a.id=prev.id; }
 });
 p.priority = auto.concat(prevManual);
}

  var ex=methods.find(function(x){ return !x.free && String(x.ro||'').trim().toLowerCase()===ro.toLowerCase(); });
  if(ex){ ex.en=rec.en; ex.desc=rec.desc; ex.suit=rec.suit; ex.tags=rec.tags; updated++; }
  else {
   rec.key=nid('m');

   if(fi>=0) methods.splice(fi,0,rec); else methods.push(rec);
   added++;
  }
 }
 if(!added && !updated){ toast(t('methodsImportFail'),'err'); return false; }
 METHOD_EDIT=null; render();

/* 2026-08-03 hotfix (manual person, no scores on the graph): behaviors typed
   into the manual editor set b.score but nothing ever derived the competency
   average from them, so c.average stayed null and c.assessed false — the
   score graph rendered "neevaluat" with no marker, on the board AND on the
   printed plan, for every manually added person.

   Scale: behavior scores are raw 0–2 (same as the .xls export's behavior
   cells); the graph's domain is the export's NORMALIZED 1–5 competency
   scale. The only linear map between them is 0→1, 1→3, 2→5, i.e.
   avg5 = 1 + mean(0–2) * 2. Unscored behaviors are ignored, not counted as
   0 — a half-filled competency averages what was actually rated.

   Imported people keep the average the source system computed: this only
   ever runs for source==='manual'. */
function recomputeAverages(p){
 if(!p || p.source!=='manual') return;
 (p.bank||[]).forEach(function(c){
  var all=[];
  (c.subs||[]).forEach(function(s){
   var sc=(s.behaviors||[]).map(function(b){return b.score;})
          .filter(function(v){ return v!=null && v!=='' && !isNaN(v); })
          .map(Number);
   s.average = sc.length ? 1 + (sc.reduce(function(a,b){return a+b;},0)/sc.length)*2 : null;
   all = all.concat(sc);
  });
  c.average  = all.length ? 1 + (all.reduce(function(a,b){return a+b;},0)/all.length)*2 : null;
  c.assessed = all.length > 0;
 });
}

/* Anti-overwhelm curation (brief DoD 3a, PO 2026-07-13: "raw list is too
   big/undelimited"): candidates grouped per competency, sorted ascending by
   score (worst first), collapsed by default beyond the worst 3 per group.

   for print/save) — only the RENDERING groups/sorts/collapses it. included
   = curated into the print shortlist (soft cap ~8–10, warned not blocked). */
var BEH_COLLAPSE_N = 3;
var BEH_SOFT_CAP = 10;
function boardBeh(p){
 if(!p.sel.length) return '<div class="card"><h3>'+t('stepBeh')+'</h3><div class="empty">'+t('noBeh')+'</div></div>';

 var curated = p.priority.filter(function(r){return r.included;}).length;

  var idxs = (byComp[compName]||[]).slice().sort(function(a,b){

   return (sa==null?99:sa)-(sb==null?99:sb);
  });
  var expanded = !!p.behExpanded[compName];
  var visible = expanded ? idxs : idxs.slice(0,BEH_COLLAPSE_N);
  var hidden = idxs.length - visible.length;
  var rowsHtml = visible.map(function(i){
   var r = p.priority[i];

   return '<div class="behrow"><input type="checkbox" '+(r.included?'checked':'')+' onchange="p_toggleBeh(activePerson(),'+i+')">'+

  }).join('');
  var toggleBtn = idxs.length>BEH_COLLAPSE_N ?
   ('<button class="btn btn-ghost btn-sm" onclick="toggleBehExpand(activePerson(),\''+jsq(compName)+'\')">'+
    (hidden>0 ? (t('behShowMore')+' '+hidden+' '+t('behShowMoreSuffix')) : t('behCollapse'))+'</button>') : '';
  return '<div class="behgroup"><div class="behgroup-head"><b>'+esc(compName)+'</b><span class="tdsub">'+idxs.length+' '+t('behCandidates')+'</span></div>'+
   (rowsHtml||'<div class="note">'+t('noPriorityBeh')+'</div>')+toggleBtn+
  '</div>';
 }).join('');
 var over = curated>BEH_SOFT_CAP;
 var badge = '<span class="curatedbadge'+(over?' over':'')+'">'+curated+' / '+total+' '+t('curatedBadge')+'</span>';
 return '<div class="card"><h3>'+t('stepBeh')+' '+badge+'</h3><div class="sub" style="margin:2px 0 10px">'+t('behHint')+'</div>'+
  (over?'<div class="warnbox">'+t('softCapWarn')+'</div>':'')+
  groups+
  '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'+
   '<button class="btn btn-ghost btn-sm" onclick="p_addBehManual(activePerson())">'+t('addBehManual')+'</button>'+
   '<button class="btn btn-ghost btn-sm" onclick="ensurePriorityFresh(activePerson());render()">'+t('behResetAuto')+'</button>'+
  '</div></div>';
}

/* =======================================================================
   Print document — portrait content flows naturally and the calendar stays
   on its own rotated A4 sheet. The print copy mirrors the combined preview:
   graph, objectives, methods and comments continue only when the content
   exceeds a sheet. Plan output stays RO/EN with the active UI language.

var MONTH_LABELS = {
 ro:['ian','feb','mar','apr','mai','iun','iul','aug','sep','oct','nov','dec'],
 en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
};
function monthTicks(minIso,maxIso){
 var d0=new Date(Date.UTC(+minIso.slice(0,4),+minIso.slice(5,7)-1,1));
 var d1=new Date(Date.UTC(+maxIso.slice(0,4),+maxIso.slice(5,7)-1,1));
 var out=[], d=d0;
 while(d<=d1){
  out.push(d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-01');
  d=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1));
 }
 return out;
}

 // brief §5: Objectives shown with NO "(score x)" — score-matched text only.
 var behHtml = Object.keys(behByComp).map(function(comp){

 return '<div class="pdoc">'+

/* shared month-grid Gantt renderer (2026-07-14 polish, DoD 4): used by the
   print Calendar page AND as a live preview on the Timeline step, so the
   consultant no longer sets dates blind. */
function calendarChartHtml(p,groups){
 if(!groups.length) return '';
 var allDates=[];
 groups.forEach(function(comp){
  var tl=compTimeline(p,comp);
  tl.picks.forEach(function(pk){ allDates.push(pk.start); allDates.push(addDays(pk.start,+pk.days||0)); });
  if(tl.feedbackFinal) allDates.push(tl.feedbackFinal);
 });
 var minD=allDates.reduce(function(a,b){return a<b?a:b}), maxD=allDates.reduce(function(a,b){return a>b?a:b});
 var domainStart = minD.slice(0,8)+'01';
 var domainEndMonth = addDays(maxD.slice(0,8)+'01',32).slice(0,8)+'01'; // first day of month AFTER maxD's month
 var span = Math.max(1,(new Date(domainEndMonth)-new Date(domainStart))/86400000);
 function pct(iso){ return Math.max(0,Math.min(100,(new Date(iso)-new Date(domainStart))/86400000/span*100)); }
 var ticks = monthTicks(domainStart,maxD);
 var gridHtml = ticks.map(function(iso){ return '<div class="calgrid" style="left:'+pct(iso)+'%"></div>'; }).join('');
 var headerHtml = '<div class="calrow calheader"><div class="calrowlabel"></div><div class="caltrack">'+gridHtml+
  ticks.map(function(iso){ return '<div class="calmonth" style="left:'+pct(iso)+'%">'+MONTH_LABELS[LANG][+iso.slice(5,7)-1]+' '+iso.slice(0,4)+'</div>'; }).join('')+
  '</div></div>';
 var bodyHtml = groups.map(function(comp){
  var mb = p.methods[comp];
  var pickRows = mb.picks.map(function(pk){
   var end = addDays(pk.start,+pk.days||0);
   var left = pct(pk.start), width = Math.max(pct(end)-left,2);
   var label = pk.method==='altele' ? (pk.otherText||methodLabel('altele')) : methodLabel(pk.method);
   // 2026-08-03 hotfix: two label variants carried on the element. "full" is
   // what goes INSIDE the pill when it is wide enough; "short" drops the
   // method name (the row label already shows it) and is what spills OUTSIDE
   // a narrow pill. fitCalendarLabels() picks between them after layout.
   var dateText = dstr(pk.start)+'–'+dstr(end)+(pk.who?' · '+pk.who:'');
   var barText  = label+' · '+dateText;
   return '<div class="calrow"><div class="calrowlabel">'+esc(label)+'</div><div class="caltrack">'+gridHtml+
    '<div class="calbar" data-full="'+esc(barText)+'" data-short="'+esc(dateText)+'" style="left:'+left+'%;width:'+width+'%">'+
     '<span class="calbartxt">'+esc(barText)+'</span></div></div></div>';
  }).join('');
  var ffRow='';
  if(mb.feedbackDate){
   var fp = pct(mb.feedbackDate);
   ffRow = '<div class="calrow calff"><div class="calrowlabel">'+t('feedbackFinal')+'</div><div class="caltrack">'+gridHtml+
    '<div class="calstar" style="left:'+fp+'%">'+ic('star',13)+'</div><div class="calstarlabel" style="left:'+fp+'%">'+dstr(mb.feedbackDate)+'</div></div></div>';
  }
  return '<div class="calgroup"><div class="calgroupname">'+esc(comp)+'</div>'+pickRows+ffRow+'</div>';
 }).join('');
 return headerHtml+bodyHtml;
}
/* 2026-08-03 hotfix (dates lost on short duration pills). The bar width is
   the DURATION — a 2-day method is a few px wide — but it was also the label
   box, with overflow:hidden, so everything past those few px (including the
   whole date range) was silently clipped. There is no pure-CSS answer: the
   available width is a % of a track whose px width only exists after layout.
   So: render, then measure. Must run AFTER the nodes are in the document and
   AFTER the brand fonts resolve (a Poppins→fallback swap changes text width),
   which is why printWhenReady() calls it on the print copy rather than the
   markup builder doing it inline.
   Placement rule: keep the full label inside while it fits; otherwise show
   the short (dates-only) label outside the pill — to the right when the track
   has room there, to the left when the bar sits near the end of the track. */
function fitCalendarLabels(root){
 if(!root || !root.querySelectorAll) return;
 [].slice.call(root.querySelectorAll('.calbar')).forEach(function(bar){
  var txt = bar.querySelector('.calbartxt'); if(!txt) return;
  bar.classList.remove('lbl-right','lbl-left');
  txt.textContent = bar.getAttribute('data-full') || txt.textContent;
  if(txt.scrollWidth <= bar.clientWidth) return;           // fits inside — done
  txt.textContent = bar.getAttribute('data-short') || txt.textContent;
  var track = bar.parentNode;
  var need  = txt.scrollWidth + 8;
  var roomRight = track.clientWidth - (bar.offsetLeft + bar.offsetWidth);
  bar.classList.add((roomRight >= need || bar.offsetLeft < need) ? 'lbl-right' : 'lbl-left');
 });
 // same clipping risk on the final-feedback star label at the domain edges
 [].slice.call(root.querySelectorAll('.calstarlabel')).forEach(function(sl){
  var track = sl.parentNode, w = sl.offsetWidth, x = sl.offsetLeft;
  if(x - w/2 < 0) sl.style.transform = 'translateX(0)';
  else if(x + w/2 > track.clientWidth) sl.style.transform = 'translateX(-100%)';
 });
}

   copy can rotate the CONTENT (class .rot on the page) instead of asking the
   PDF engine for a second, landscape page size. `forPrint` is false for the
   on-screen preview, which stays a wide landscape card as before. */
function personPagesHtml(p,forPrint){

/* 2026-07-24 print-fidelity fix: wait for the brand fonts AND every image in
   the print copy (BHB logos, the objectives illustration) to finish loading
   before opening the print dialog. The old fixed 50 ms timer fired while the
   dark cover's white logo and the webp illustration were often still decoding,
   so they printed blank / in a fallback font. */
function printWhenReady(area){
 var imgs=[].slice.call(area.querySelectorAll('img'));
 var waits=imgs.map(function(im){
  if(im.complete && im.naturalWidth>0) return Promise.resolve();
  if(im.decode) return im.decode().catch(function(){});
  return new Promise(function(res){ im.onload=im.onerror=res; });
 });
 var fonts=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
 var safety=new Promise(function(res){ setTimeout(res,3000); }); // never hang if an asset stalls
 Promise.race([Promise.all([fonts].concat(waits)), safety]).then(function(){
  // 2026-08-03: measure the Gantt labels here — the print copy is in the
  // document at its true A4 dimensions and the brand fonts have resolved, so
  // what we measure is what the PDF gets.
  fitCalendarLabels(area);
  requestAnimationFrame(function(){ window.print(); area.style.display='none'; });
 });
}

/* crash recovery + close-tab guard (DoD 1) */
try{
 var _b = localStorage.getItem(BACKUP_KEY);
 if(_b){ var _ob = JSON.parse(_b); if(_ob && ((_ob.people && _ob.people.length) || String(_ob.groupProject||'').trim())) RESTORE_OFFER = _ob; }
}catch(e){}
window.addEventListener('beforeunload',function(e){
 if(isDirty()){ e.preventDefault(); e.returnValue=''; }
});
setInterval(autoBackup, 20000);
render();
/* 2026-08-03: the first render can land before the brand fonts resolve, and
   the on-screen preview's track width changes with the window — re-measure
   the Gantt labels in both cases. */
if(document.fonts && document.fonts.ready){
 document.fonts.ready.then(function(){ fitCalendarLabels(document.getElementById('app')); });
}
var _refitT=null;
window.addEventListener('resize',function(){
 clearTimeout(_refitT);
 _refitT=setTimeout(function(){ fitCalendarLabels(document.getElementById('app')); },150);
});
</script>
